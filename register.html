<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#EEF2FF" />
  <meta name="description" content="Crea tu cuenta de VeiSwap." />
  <title>Crear cuenta — VeiSwap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="register.css" />
</head>
<body>
  <main class="auth-shell">
    <a class="auth-brand" href="index.html" aria-label="Volver a VeiSwap">
      <span class="auth-brand-icon" aria-hidden="true">
        <i data-lucide="repeat-2"></i>
      </span>
      <span>VeiSwap</span>
    </a>

    <a class="back-link" href="index.html">
      <i data-lucide="arrow-left" aria-hidden="true"></i>
      <span>Volver</span>
    </a>

    <section class="auth-card" aria-labelledby="registerTitle">
      <div class="auth-mark" aria-hidden="true">
        <i data-lucide="user-plus"></i>
      </div>

      <h1 id="registerTitle">Crea tu cuenta</h1>
      <p class="auth-subtitle">Empieza a usar VeiSwap con tu correo electrónico.</p>

      <form class="auth-form" id="registerForm" novalidate>
        <label class="field-label" for="email">Correo electrónico</label>
        <div class="input-wrap">
          <i data-lucide="mail" aria-hidden="true"></i>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="nombre@correo.com" required />
        </div>

        <label class="field-label" for="password">Contraseña</label>
        <div class="input-wrap">
          <i data-lucide="lock-keyhole" aria-hidden="true"></i>
          <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" minlength="8" required />
          <button class="password-toggle" type="button" data-target="password" aria-label="Mostrar contraseña">
            <i data-lucide="eye" aria-hidden="true"></i>
          </button>
        </div>

        <label class="field-label" for="confirmPassword">Repetir contraseña</label>
        <div class="input-wrap">
          <i data-lucide="lock-keyhole" aria-hidden="true"></i>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Repite tu contraseña" minlength="8" required />
          <button class="password-toggle" type="button" data-target="confirmPassword" aria-label="Mostrar contraseña repetida">
            <i data-lucide="eye" aria-hidden="true"></i>
          </button>
        </div>

        <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>

        <button class="email-button" type="submit">
          <span>Continuar con correo</span>
          <i data-lucide="arrow-right" aria-hidden="true"></i>
        </button>
      </form>

      <div class="auth-divider" aria-hidden="true">
        <span></span>
        <small>o</small>
        <span></span>
      </div>

      <button class="google-button" type="button">
        <i data-lucide="chrome" aria-hidden="true"></i>
        <span>Continuar con Google</span>
      </button>

      <p class="signin-copy">
        ¿Ya tienes una cuenta?
        <a href="index.html">Iniciar sesión</a>
      </p>
    </section>

    <p class="auth-legal">
      Al continuar, aceptas los <a href="#">Términos de servicio</a> y la <a href="#">Política de privacidad</a> de VeiSwap.
    </p>
  </main>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="register.js"></script>
</body>
</html>
