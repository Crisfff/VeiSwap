<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#EEF2FF" />
  <meta name="description" content="Crea tu cuenta de VeiSwap." />
  <title>Crear cuenta — VeiSwap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="register.css" />
</head>
<body>
  <main class="auth-shell">
    <a class="auth-brand" href="index.html" aria-label="Volver a VeiSwap">
      <span class="brand-logo" aria-hidden="true"></span>
    </a>

    <a class="back-link" href="index.html">
      <i data-lucide="arrow-left" aria-hidden="true"></i>
      <span>Volver</span>
    </a>

    <section class="auth-card" id="registerStep" aria-labelledby="registerTitle">
      <div class="auth-mark" aria-hidden="true">
        <span class="center-logo"></span>
      </div>

      <h1 id="registerTitle">Crea tu cuenta</h1>
      <p class="auth-subtitle">Empieza a usar VeiSwap con tu correo electrónico.</p>

      <form class="auth-form" id="registerForm" novalidate>
        <label class="field-label" for="email">Correo electrónico</label>
        <div class="input-wrap">
          <i data-lucide="mail" aria-hidden="true"></i>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="nombre@correo.com" required />
        </div>

        <label class="field-label" for="password">Contraseña</label>
        <div class="input-wrap">
          <i data-lucide="lock-keyhole" aria-hidden="true"></i>
          <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" minlength="8" required />
          <button class="password-toggle" type="button" data-target="password" aria-label="Mostrar contraseña">
            <i data-lucide="eye" aria-hidden="true"></i>
          </button>
        </div>

        <label class="field-label" for="confirmPassword">Repetir contraseña</label>
        <div class="input-wrap">
          <i data-lucide="lock-keyhole" aria-hidden="true"></i>
          <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Repite tu contraseña" minlength="8" required />
          <button class="password-toggle" type="button" data-target="confirmPassword" aria-label="Mostrar contraseña repetida">
            <i data-lucide="eye" aria-hidden="true"></i>
          </button>
        </div>

        <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>

        <button class="email-button" id="registerButton" type="submit">
          <span>Continuar con correo</span>
          <i data-lucide="arrow-right" aria-hidden="true"></i>
        </button>
      </form>

      <div class="auth-divider" aria-hidden="true">
        <span></span>
        <small>o</small>
        <span></span>
      </div>

      <button class="google-button" type="button">
        <svg class="google-g" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.4-.18-2.06H12v3.9h5.39a4.61 4.61 0 0 1-2 3.03v2.53h3.24c1.9-1.75 2.97-4.33 2.97-7.4Z"/>
          <path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.63-2.37l-3.24-2.53c-.9.6-2.05.96-3.39.96-2.61 0-4.82-1.76-5.61-4.13H3.04v2.61A10 10 0 0 0 12 22Z"/>
          <path fill="#FBBC05" d="M6.39 13.93A6.02 6.02 0 0 1 6.08 12c0-.67.11-1.32.31-1.93V7.46H3.04A10 10 0 0 0 2 12c0 1.61.38 3.14 1.04 4.54l3.35-2.61Z"/>
          <path fill="#EA4335" d="M12 5.94c1.47 0 2.79.5 3.83 1.5l2.87-2.87C16.96 2.95 14.7 2 12 2a10 10 0 0 0-8.96 5.46l3.35 2.61C7.18 7.7 9.39 5.94 12 5.94Z"/>
        </svg>
        <span>Continuar con Google</span>
      </button>

      <p class="signin-copy">
        ¿Ya tienes una cuenta?
        <a href="login.html">Iniciar sesión</a>
      </p>
    </section>

    <section class="auth-card otp-card" id="otpStep" aria-labelledby="otpTitle" hidden>
      <div class="auth-mark" aria-hidden="true">
        <span class="center-logo"></span>
      </div>

      <div class="otp-badge" aria-hidden="true">OTP</div>
      <h1 id="otpTitle">Verifica tu correo</h1>
      <p class="auth-subtitle otp-subtitle">
        Introduce el código de 6 dígitos que enviamos a <strong id="otpEmail"></strong>.
      </p>

      <form class="otp-form" id="otpForm" novalidate>
        <div class="otp-inputs" id="otpInputs" aria-label="Código de verificación de 6 dígitos">
          <input class="otp-input" inputmode="numeric" autocomplete="one-time-code" maxlength="1" aria-label="Dígito 1" />
          <input class="otp-input" inputmode="numeric" maxlength="1" aria-label="Dígito 2" />
          <input class="otp-input" inputmode="numeric" maxlength="1" aria-label="Dígito 3" />
          <input class="otp-input" inputmode="numeric" maxlength="1" aria-label="Dígito 4" />
          <input class="otp-input" inputmode="numeric" maxlength="1" aria-label="Dígito 5" />
          <input class="otp-input" inputmode="numeric" maxlength="1" aria-label="Dígito 6" />
        </div>

        <p class="form-message otp-message" id="otpMessage" role="status" aria-live="polite"></p>

        <button class="email-button verify-button" id="verifyButton" type="submit">
          <span>Verificar código</span>
          <i data-lucide="check" aria-hidden="true"></i>
        </button>

        <button class="otp-back" id="otpBack" type="button">
          <i data-lucide="arrow-left" aria-hidden="true"></i>
          Cambiar correo
        </button>
      </form>
    </section>

    <p class="auth-legal">
      Al continuar, aceptas los <a href="#">Términos de servicio</a> y la <a href="#">Política de privacidad</a> de VeiSwap.
    </p>
  </main>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="register.js"></script>
</body>
</html>
