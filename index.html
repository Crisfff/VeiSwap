<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#171717" />
  <meta name="description" content="VeiSwap, mercado P2P no custodial para intercambiar USDT directamente entre personas." />
  <title>VeiSwap — P2P entre personas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="hero-shell">
    <nav class="nav container" aria-label="Navegación principal">
      <a class="brand" href="#" aria-label="VeiSwap inicio">
        <span class="brand-icon" aria-hidden="true">
          <i data-lucide="repeat-2"></i>
        </span>
        <span class="brand-name">VeiSwap</span>
      </a>

      <div class="nav-links" id="navLinks">
        <a href="#mercado">Mercado P2P</a>
        <a href="#como-funciona">Cómo funciona</a>
        <a href="#seguridad">Seguridad</a>
        <a href="#tarifas">Tarifas</a>
      </div>

      <div class="nav-actions">
        <a class="btn btn-ghost" href="#login">Iniciar sesión</a>
        <a class="btn btn-primary" href="#registro">
          Crear cuenta
          <i data-lucide="arrow-up-right" aria-hidden="true"></i>
        </a>
      </div>

      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Abrir menú" aria-expanded="false">
        <i data-lucide="menu" aria-hidden="true"></i>
      </button>
    </nav>

    <section class="hero container">
      <div class="hero-copy">
        <div class="eyebrow">
          <i data-lucide="shield-check" aria-hidden="true"></i>
          <span>P2P no custodial</span>
        </div>

        <h1>
          Tu dinero.<br />
          <span>Tu control.</span>
        </h1>

        <p class="hero-description">
          Compra y vende USDT directamente entre personas. VeiSwap conecta las partes,
          protege la operación y tú mantienes el control de tus fondos.
        </p>

        <div class="hero-actions">
          <a class="btn btn-primary btn-large" href="#mercado">
            Explorar mercado
            <i data-lucide="arrow-right" aria-hidden="true"></i>
          </a>
          <a class="btn btn-secondary btn-large" href="#como-funciona">
            Cómo funciona
            <i data-lucide="circle-play" aria-hidden="true"></i>
          </a>
        </div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
